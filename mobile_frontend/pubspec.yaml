name: mobile_frontend
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

#A
#B
  bloc: ^9.2.1
  
#C
#D
  dropdown_search: ^7.0.0
#E
#F
  flutter_bloc: ^9.1.1
  # Official Flutter localization (gen_l10n). Not the same as the unused
  # third-party `flutter_localization` below (see docs, D-P12).
  flutter_localizations:
    sdk: flutter
  flutter_localization: ^0.4.1
#G
  google_api_headers: ^5.3.5
  geocoding: ^5.0.1
  google_maps_flutter: ^2.18.1
  go_router: ^18.1.4
#H
  http: ^1.6.0
#I
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.2
#J
#K
#L
  location: ^10.0.2
#M
#N
#O
#P
  permission_handler: ^13.0.2
  # Icon family for the main navigation bar (Regular / Fill / Bold styles).
  phosphor_icons: ^3.0.1
#Q
#R
  responsive_framework: ^1.5.1
#S
#T
  toasty_box: ^1.0.4
#U
  url_launcher: ^6.3.3
  
#V
#X
#Y
#Z 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates AppLocalizations from the ARB files configured in l10n.yaml.
  generate: true
  assets:
    - assets/images/png/
    # SHAHM_DEMO_START pubspec-assets
    # Debug demo fixtures (Task 37). Declared assets are packaged in EVERY
    # build, release included: remove the demo before any release build.
    - assets/demo/fixtures/
    # SHAHM_DEMO_END pubspec-assets
  # IBM Plex Sans Arabic (D-A63), official IBM release
  # @ibm/plex-sans-arabic@1.1.0, SIL Open Font License 1.1 (OFL.txt).
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Light.ttf
          weight: 300
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ibm_plex_sans_arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
