# gen_l10n configuration (Flutter's official localization workflow).
# Arabic is the template and the default language; English (app_en.arb) is
# the captain's alternative, chosen in Settings. Only ar and en are supported.
# Every key in app_ar.arb needs its English message in app_en.arb.
# Generated files go to lib/helper/translation/generated/ — never edit them.
arb-dir: lib/helper/translation
template-arb-file: app_ar.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
output-dir: lib/helper/translation/generated
# AppLocalizations.of(context) returns a non-null instance.
nullable-getter: false
